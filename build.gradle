plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	mavenLocal()
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Built by the sibling minigameplayground-core project. Runtime is provided by the
	// separately installed core mod.
	compileOnly files("../minigameplayground-core/build/devlibs/minigameplayground-${project.core_version}-dev.jar")

	// Simply Skills is a required runtime dependency; it is not bundled. Compile-only is
	// enough because the addon only needs the target class metadata for Mixin's
	// annotation processor at build time.
	modCompileOnly "maven.modrinth:simply-skills:1.7.2+1.20.1"
	modCompileOnly "maven.modrinth:skills:0.15.4"

	// Provided at runtime by Fabric Loader; used to wrap the magic-absorb call so
	// another mod cannot cancel our damage scaling by setting a RETURN value.
	compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.0"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()
}

loom {
	mixin {
		defaultRefmapName = 'minigameplayground_simplyskills.refmap.json'
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
